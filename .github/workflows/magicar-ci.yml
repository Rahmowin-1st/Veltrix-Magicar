name: Veltrix Magicar CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veltrix-magicar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --channel=3 "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Prepare offline Hey Magicar model
        run: |
          python3 -m pip install --disable-pip-version-check --quiet sentencepiece
          bash scripts/prepare_magicar_kws.sh
      - name: Android debug, release and unit tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest --stacktrace
      - name: Upload Magicar debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-magicar-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload Magicar unsigned release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-magicar-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish public Magicar APK
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          ASSET="$RUNNER_TEMP/Veltrix-Magicar-RC3-debug.apk"
          TAG="magicar-rc3"
          test -s "$SRC"
          cp "$SRC" "$ASSET"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Veltrix Magicar RC3" \
              --notes "Public install build for Veltrix Magicar RC3. Built and tested by the main CI workflow."
          fi


  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
