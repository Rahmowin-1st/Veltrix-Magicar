version: 2.1

jobs:
  mcp-server:
    docker:
      - image: cimg/node:20.18.1
      - image: postgres:17-alpine
        environment:
          POSTGRES_USER: ultron
          POSTGRES_PASSWORD: ultron
          POSTGRES_DB: ultron_test
    resource_class: small
    working_directory: ~/project
    environment:
      ULTRON_TEST_DATABASE_URL: postgresql://ultron:ultron@127.0.0.1:5432/ultron_test
    steps:
      - checkout
      - restore_cache:
          keys:
            - veltrix-mcp-v5-{{ checksum "mcp-server/package-lock.json" }}
            - veltrix-mcp-v5-
      - run:
          name: Install locked MCP dependencies
          command: cd mcp-server && npm ci --no-audit --no-fund
      - save_cache:
          key: veltrix-mcp-v5-{{ checksum "mcp-server/package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: MCP typecheck
          command: cd mcp-server && npm run typecheck
      - run:
          name: MCP build
          command: cd mcp-server && npm run build
      - run:
          name: MCP security and routing self-test
          command: cd mcp-server && npm test
      - run:
          name: Durable Postgres bridge integration test
          command: cd mcp-server && npm run test:postgres
      - store_artifacts:
          path: mcp-server/dist
          destination: mcp-server-dist

  android-build:
    machine:
      image: android:2026.05.1
    resource_class: medium
    environment:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2304m -Dfile.encoding=UTF-8"
    steps:
      - checkout

      - run:
          name: Select Java 17
          command: |
            set -euo pipefail
            JAVA17="$(update-alternatives --list java | grep 'java-17' | head -n 1)"
            JAVAC17="$(update-alternatives --list javac | grep 'java-17' | head -n 1)"
            if [ -z "$JAVA17" ] || [ -z "$JAVAC17" ]; then
              echo "Java 17 alternative was not found" >&2
              exit 1
            fi
            sudo update-alternatives --set java "$JAVA17"
            sudo update-alternatives --set javac "$JAVAC17"
            JAVA_HOME_17="$(dirname "$(dirname "$(readlink -f "$JAVA17")")")"
            echo "export JAVA_HOME=$JAVA_HOME_17" >> "$BASH_ENV"
            echo 'export PATH="$JAVA_HOME/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            java -version
            java -version 2>&1 | grep -q 'version "17\.'

      - run:
          name: Ensure Android API 37 toolchain
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              SDKMANAGER="$(command -v sdkmanager || true)"
            fi
            if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
              echo "sdkmanager was not found in the CircleCI Android image" >&2
              exit 1
            fi
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --channel=3 \
              "platform-tools" \
              "platforms;android-37.0" \
              "build-tools;37.0.0" \
              "build-tools;36.0.0"

      - restore_cache:
          keys:
            - veltrix-gradle-dist-v2-9.5.0

      - run:
          name: Provision Gradle 9.5
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            ROOT="$HOME/.veltrix-tools"
            GRADLE_HOME="$ROOT/gradle-9.5.0"
            if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
              mkdir -p "$ROOT"
              curl -fL --retry 5 --retry-delay 2 \
                -o /tmp/gradle-9.5.0-bin.zip \
                https://services.gradle.org/distributions/gradle-9.5.0-bin.zip
              rm -rf "$GRADLE_HOME"
              unzip -q /tmp/gradle-9.5.0-bin.zip -d "$ROOT"
            fi
            echo 'export PATH="$HOME/.veltrix-tools/gradle-9.5.0/bin:$PATH"' >> "$BASH_ENV"
            "$GRADLE_HOME/bin/gradle" --version

      - save_cache:
          key: veltrix-gradle-dist-v2-9.5.0
          paths:
            - ~/.veltrix-tools/gradle-9.5.0

      - restore_cache:
          keys:
            - veltrix-gradle-cache-v3-{{ checksum "app/build.gradle.kts" }}-{{ checksum "settings.gradle.kts" }}
            - veltrix-gradle-cache-v3-

      - run:
          name: Validate release verifier syntax
          command: bash -n scripts/android-release-ci.sh

      - run:
          name: Build debug and release variants plus unit tests
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest --stacktrace

      - save_cache:
          key: veltrix-gradle-cache-v3-{{ checksum "app/build.gradle.kts" }}-{{ checksum "settings.gradle.kts" }}
          paths:
            - ~/.gradle/caches

      - store_test_results:
          path: app/build/test-results

      - store_artifacts:
          path: app/build/outputs/apk/debug/app-debug.apk
          destination: veltrix-ultron-debug.apk

  android-release-secrets-preflight:
    docker:
      - image: cimg/node:20.18.1
    resource_class: small
    steps:
      - run:
          name: Validate release signing secret presence
          command: |
            set -euo pipefail
            required=(
              VELTRIX_RELEASE_KEYSTORE_B64
              VELTRIX_RELEASE_STORE_PASSWORD
              VELTRIX_RELEASE_KEY_ALIAS
              VELTRIX_RELEASE_KEY_PASSWORD
            )
            for name in "${required[@]}"; do
              if [ -z "${!name:-}" ]; then
                echo "Release signing secret preflight failed: required project environment is incomplete" >&2
                exit 2
              fi
            done
            echo "Release signing secret preflight PASS"

  android-release-signer-preflight:
    machine:
      image: android:2026.05.1
    resource_class: medium
    steps:
      - checkout

      - run:
          name: Select Java 17
          command: |
            set -euo pipefail
            JAVA17="$(update-alternatives --list java | grep 'java-17' | head -n 1)"
            JAVAC17="$(update-alternatives --list javac | grep 'java-17' | head -n 1)"
            if [ -z "$JAVA17" ] || [ -z "$JAVAC17" ]; then
              echo "Java 17 alternative was not found" >&2
              exit 1
            fi
            sudo update-alternatives --set java "$JAVA17"
            sudo update-alternatives --set javac "$JAVAC17"
            JAVA_HOME_17="$(dirname "$(dirname "$(readlink -f "$JAVA17")")")"
            echo "export JAVA_HOME=$JAVA_HOME_17" >> "$BASH_ENV"
            echo 'export PATH="$JAVA_HOME/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            java -version
            java -version 2>&1 | grep -q 'version "17\.'

      - run:
          name: Validate production release signer identity
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            required=(
              VELTRIX_RELEASE_KEYSTORE_B64
              VELTRIX_RELEASE_STORE_PASSWORD
              VELTRIX_RELEASE_KEY_ALIAS
            )
            for name in "${required[@]}"; do
              if [ -z "${!name:-}" ]; then
                echo "Release signer preflight failed: required signing environment is incomplete" >&2
                exit 2
              fi
            done

            EXPECTED_SIGNER_CERT_SHA256="$(grep -E '^EXPECTED_SIGNER_CERT_SHA256="[0-9a-fA-F]{64}"$' scripts/android-release-ci.sh | head -n 1 | cut -d'"' -f2)"
            if [[ ! "$EXPECTED_SIGNER_CERT_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "Release signer preflight could not resolve the pinned production certificate" >&2
              exit 2
            fi
            EXPECTED_SIGNER_CERT_SHA256="${EXPECTED_SIGNER_CERT_SHA256,,}"

            SECURE_DIR="$HOME/.veltrix-release-preflight"
            KEYSTORE="$SECURE_DIR/release.jks"
            rm -rf "$SECURE_DIR"
            mkdir -p "$SECURE_DIR"
            chmod 700 "$SECURE_DIR"
            trap 'rm -f "$KEYSTORE"' EXIT

            if ! printf '%s' "$VELTRIX_RELEASE_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"; then
              echo "Release signer preflight could not decode the configured keystore" >&2
              exit 2
            fi
            if [ ! -s "$KEYSTORE" ]; then
              echo "Release signer preflight found an empty keystore" >&2
              exit 2
            fi
            chmod 600 "$KEYSTORE"
            export VELTRIX_ANDROID_KEYSTORE_PASSWORD="$VELTRIX_RELEASE_STORE_PASSWORD"

            keytool -list \
              -keystore "$KEYSTORE" \
              -storepass:env VELTRIX_ANDROID_KEYSTORE_PASSWORD \
              -alias "$VELTRIX_RELEASE_KEY_ALIAS" \
              >/dev/null

            ACTUAL_SIGNER_CERT_SHA256="$(keytool -exportcert \
              -keystore "$KEYSTORE" \
              -storepass:env VELTRIX_ANDROID_KEYSTORE_PASSWORD \
              -alias "$VELTRIX_RELEASE_KEY_ALIAS" \
              | sha256sum | awk '{print $1}')"
            if [[ ! "$ACTUAL_SIGNER_CERT_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "Release signer preflight could not derive the configured certificate digest" >&2
              exit 2
            fi
            ACTUAL_SIGNER_CERT_SHA256="${ACTUAL_SIGNER_CERT_SHA256,,}"
            if [ "$ACTUAL_SIGNER_CERT_SHA256" != "$EXPECTED_SIGNER_CERT_SHA256" ]; then
              echo "Release signer preflight rejected a keystore that does not match the production Play Integrity signer" >&2
              exit 3
            fi

            rm -f "$KEYSTORE"
            trap - EXIT
            echo "Release signer identity preflight PASS"

  android-release-signed:
    machine:
      image: android:2026.05.1
    resource_class: medium
    environment:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2304m -Dfile.encoding=UTF-8"
      VELTRIX_EXPECTED_APPLICATION_ID: "com.veltrix.ultron"
      VELTRIX_EXPECTED_VERSION_CODE: "1"
      VELTRIX_EXPECTED_VERSION_NAME: "0.1.0-v0"
    steps:
      - checkout

      - run:
          name: Select Java 17
          command: |
            set -euo pipefail
            JAVA17="$(update-alternatives --list java | grep 'java-17' | head -n 1)"
            JAVAC17="$(update-alternatives --list javac | grep 'java-17' | head -n 1)"
            if [ -z "$JAVA17" ] || [ -z "$JAVAC17" ]; then
              echo "Java 17 alternative was not found" >&2
              exit 1
            fi
            sudo update-alternatives --set java "$JAVA17"
            sudo update-alternatives --set javac "$JAVAC17"
            JAVA_HOME_17="$(dirname "$(dirname "$(readlink -f "$JAVA17")")")"
            echo "export JAVA_HOME=$JAVA_HOME_17" >> "$BASH_ENV"
            echo 'export PATH="$JAVA_HOME/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            java -version
            java -version 2>&1 | grep -q 'version "17\.'

      - run:
          name: Ensure Android API 37 toolchain
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              SDKMANAGER="$(command -v sdkmanager || true)"
            fi
            if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
              echo "sdkmanager was not found in the CircleCI Android image" >&2
              exit 1
            fi
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --channel=3 \
              "platform-tools" \
              "platforms;android-37.0" \
              "build-tools;37.0.0" \
              "build-tools;36.0.0"

      - restore_cache:
          keys:
            - veltrix-gradle-dist-v2-9.5.0

      - run:
          name: Provision Gradle 9.5
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            ROOT="$HOME/.veltrix-tools"
            GRADLE_HOME="$ROOT/gradle-9.5.0"
            if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
              mkdir -p "$ROOT"
              curl -fL --retry 5 --retry-delay 2 \
                -o /tmp/gradle-9.5.0-bin.zip \
                https://services.gradle.org/distributions/gradle-9.5.0-bin.zip
              rm -rf "$GRADLE_HOME"
              unzip -q /tmp/gradle-9.5.0-bin.zip -d "$ROOT"
            fi
            echo 'export PATH="$HOME/.veltrix-tools/gradle-9.5.0/bin:$PATH"' >> "$BASH_ENV"
            "$GRADLE_HOME/bin/gradle" --version

      - restore_cache:
          keys:
            - veltrix-gradle-cache-v3-{{ checksum "app/build.gradle.kts" }}-{{ checksum "settings.gradle.kts" }}
            - veltrix-gradle-cache-v3-

      - run:
          name: Validate signed release verifier syntax
          command: bash -n scripts/android-release-ci.sh

      - run:
          name: Build and verify signed release artifacts
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            bash scripts/android-release-ci.sh

      - store_test_results:
          path: app/build/test-results

      - store_artifacts:
          path: release-evidence
          destination: veltrix-ultron-signed-release

workflows:
  full-cloud-ci:
    jobs:
      - mcp-server
      - android-build
      - android-release-secrets-preflight:
          filters:
            branches:
              only: /^release\/.*/
      - android-release-signer-preflight:
          requires:
            - android-release-secrets-preflight
          filters:
            branches:
              only: /^release\/.*/
      - android-release-signed:
          requires:
            - android-release-signer-preflight
          filters:
            branches:
              only: /^release\/.*/
